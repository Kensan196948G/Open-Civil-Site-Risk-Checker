<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Open Civil Site Risk Checker">
  <title>工事候補地リスクチェッカー</title>
  <defs>
    <!-- ブランドのアクセント（ライト #15616d → ダーク #2f9fb0）を対角グラデに -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15616d"/>
      <stop offset="1" stop-color="#2f9fb0"/>
    </linearGradient>
  </defs>
  <!-- タイル背景（ライト/ダーク両タブバーで映えるよう塗りつぶし） -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#tile)"/>
  <!-- ロケーションピン（工事候補地の「地点」）: 16px でも識別できる白い teardrop -->
  <path d="M16 5.25c-4.7 0-8.5 3.8-8.5 8.5 0 5.9 8.5 12.5 8.5 12.5s8.5-6.6 8.5-12.5c0-4.7-3.8-8.5-8.5-8.5z"
        fill="#ffffff"/>
  <!-- 注目ドット（「確認すべき論点」をアンバーで示す。安全/承認は断定しない設計に合わせ✓は使わない） -->
  <circle cx="16" cy="13.5" r="3.1" fill="#f2a93b"/>
</svg>
