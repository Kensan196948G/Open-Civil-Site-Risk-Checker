name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ブランチの古い実行は新しい push で打ち切る。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: frontend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # サプライチェーン対策でアクションは SHA でピン留め（コメントは対応タグ）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # トークンを .git/config に残さない

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # デプロイ用 Dockerfile（node:22-alpine）と揃える。
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test

      - name: Smoke tests (esbuild runner / 環境非依存の二重検証)
        run: npm run test:smoke

      # 実プロセスを起動する HTTP サーバ統合テスト（JWT・プロキシ・セキュリティヘッダ）。
      # 外部評価 Phase 0: これまで CI 未組込で回帰を見逃すリスクがあったため必須化する。
      - name: Server integration tests (node server.mjs)
        run: npm run test:server

      - name: Build
        run: npm run build

  backend:
    name: backend (ruff / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # KSJ 空間検索の統合テスト用 PostGIS（tests/test_ksj_db_integration.py）。
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ocsrc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OCSRC_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ocsrc_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # デプロイ用 Dockerfile.backend（python:3.12-slim）と揃える。
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest

  security:
    name: security (npm audit / pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json ベースで照会するため npm ci は不要。high 以上で fail。
      - name: Audit npm dependencies (high+)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install pip-audit
        run: pip install pip-audit

      # 既知脆弱性（PyPI Advisory DB / OSV）検出時に fail するゲート。
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt
