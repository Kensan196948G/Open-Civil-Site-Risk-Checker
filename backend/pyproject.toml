[project]
name = "ocsrc-backend"
version = "0.1.0"
description = "Open Civil Site Risk Checker backend (FastAPI, Phase 2)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
